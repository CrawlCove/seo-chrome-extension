<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>stage</title>
<style>
  html,body{margin:0;width:1280px;height:800px;overflow:hidden;background:#05060A;color:#F2F5FA;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  body{position:relative;background:
    radial-gradient(600px 400px at 85% 10%, rgba(34,211,238,.10), transparent 60%),
    radial-gradient(500px 500px at 10% 100%, rgba(124,92,255,.14), transparent 60%), #05060A}
  .copy{position:absolute;left:84px;top:150px;width:540px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px;letter-spacing:.01em;color:#C7CEDB}
  .brand img{width:36px;height:36px}
  h1{font:600 52px/1.08 "Space Grotesk",Inter,system-ui,sans-serif;margin:34px 0 18px;letter-spacing:-.01em}
  h1 em{font-style:normal;background:linear-gradient(135deg,#22D3EE,#7C5CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{font-size:20px;line-height:1.45;color:#C7CEDB;margin:0 0 26px}
  ul{list-style:none;padding:0;margin:0;font-size:17px;color:#8A93A6}
  ul li{padding:6px 0 6px 26px;position:relative}
  ul li::before{content:"";position:absolute;left:0;top:14px;width:10px;height:10px;border-radius:50%;background:#34F5C5}
  .frame{position:absolute;right:84px;top:40px;width:460px;height:720px;border-radius:16px;overflow:hidden;border:1px solid #1E2533;
    box-shadow:0 0 0 1px rgba(34,211,238,.08),0 30px 80px -30px rgba(34,211,238,.35),0 20px 60px -20px rgba(0,0,0,.8);background:#05060A}
  iframe{width:460px;height:720px;border:0;display:block}
  .foot{position:absolute;left:84px;bottom:40px;font-size:14px;color:#8A93A6}
</style></head>
<body>
  <div class="copy">
    <div class="brand"><img src="../icons/icon-128.png" alt=""> Crawl Cove</div>
    <h1 id="h"></h1>
    <p id="p"></p>
    <ul id="l"></ul>
  </div>
  <div class="frame"><iframe id="f" src="../popup/popup.html"></iframe></div>
  <div class="foot">Open source. No account. Nothing leaves your browser.</div>
</body></html>
